name: Real-data trial (temporary)

# Development only, removed before merge.

on:
  push:
    branches: [fotmob-probe]
    paths: [".github/workflows/smoke.yml"]

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Four matches
        run: |
          python - <<'PY'
          import json
          from football.fotmob import Client
          from football.model import slim_match
          c = Client(max_requests=10)
          for mid in (5868051, 5881154, 5802965, 5868033):
              raw = c.match(mid)
              s = slim_match(raw)
              print("##", mid, s["home"], s["away"], "coverage", s["coverage"])
              for e in s["events"]:
                  if e["type"] == "Goal": print("   event", json.dumps(e, ensure_ascii=False))
              for x in s["shots"]:
                  if x["eventType"] == "Goal": print("   shot ", x["teamId"], x["playerId"], x["playerName"], x["situation"], "own" if x["isOwnGoal"] else "", x["min"])
              for p in s["players"]:
                  g = p["stats"].get("goals")
                  if g: print("   stat ", p["team_id"], p["id"], p["name"], "goals", g)
              ev = [e for e in ((raw.get("content") or {}).get("matchFacts") or {}).get("events", {}).get("events", []) if e.get("type") == "Goal"]
              print("   raw goal event keys with values:", [{k: v for k, v in e.items() if k in ("ownGoal", "goalDescription", "goalDescriptionKey", "isHome", "nameStr", "playerId", "newScore", "shotmapEvent") and k != "shotmapEvent"} for e in ev])
          PY
