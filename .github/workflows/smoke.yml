name: Real-data trial (temporary)

# Development only, removed before merge: the whole flow on real FotMob data, into a local
# SQLite file instead of BigQuery.

on:
  push:
    branches: [fotmob-probe]
    paths: ["football/**", ".github/workflows/smoke.yml", "config/**"]

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      ARGS: "--backend sqlite --db trial.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update, check, draft
        run: python -m football daily $ARGS --max-requests 560 --md drafts.md --top 25 || echo "EXIT $?"
      - name: Status
        run: python -m football status $ARGS
      - name: Drafts
        run: cat drafts.md || true
      - name: Rows
        run: |
          python - <<'PY'
          import sqlite3, json
          con = sqlite3.connect("trial.db"); con.row_factory = sqlite3.Row
          def show(title, sql):
              print("##", title)
              for r in con.execute(sql): print("  ", dict(r))
          show("checks", "select check_id, status, row_count, sample from core_quality_checks")
          show("matches by league", "select league, season, count(*) n from core_team_stats group by 1,2")
          show("top scorers", "select league, player, max(team) team, count(*) games, sum(minutes) minutes, sum(goals) goals, sum(penalty_goals) pens, sum(assists) assists, round(sum(xg),2) xg, sum(shots) shots from core_player_matches where season=2026 group by league, player_id order by goals desc limit 12")
          show("own goals", "select match_id, player, team, own_goals from core_player_matches where own_goals>0 limit 8")
          show("own goal shots", "select match_id, player, team, home_away, result, xg from core_shots where own_goal=1 limit 8")
          show("reds", "select match_id, player, team, yellow, red from core_player_matches where red>0 limit 8")
          show("shot results", "select result, situation, count(*) n from core_shots group by 1,2 order by n desc")
          show("matches per season with details", "select season, count(*) n, sum(problem is not null) unusable from raw_match group by 1")
          show("raw size", "select count(*) n, round(avg(length(payload))) avg_bytes, max(length(payload)) max_bytes from raw_match")
          show("team stats nulls", "select count(*) n, sum(xg is null) no_xg, sum(shots is null) no_shots, sum(possession is null) no_poss, sum(npxg is null) no_npxg from core_team_stats")
          show("player nulls", "select season, count(*) n, sum(minutes is null) no_min, sum(started is null) no_start, sum(rating is null) no_rating, sum(touches is null) no_touches from core_player_matches group by 1")
          show("fixtures", "select league, status, count(*) n from core_fixtures group by 1,2")
          show("standings", "select league, team, position, played, points, round(xg,1) xg, round(xga,1) xga, round(xpts,1) xpts from core_standings where season=2026 and position<=2 order by league")
          show("runs", "select * from core_runs")
          PY
