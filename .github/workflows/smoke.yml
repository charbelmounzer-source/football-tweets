name: Real-data trial (temporary)

# Development only, removed before merge: the whole flow on real FotMob data, into a local
# SQLite file instead of BigQuery.

on:
  push:
    branches: [fotmob-probe]
    paths: [".github/workflows/smoke.yml"]

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      ARGS: "--backend sqlite --db trial.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m football daily $ARGS --leagues La_Liga,Bundesliga,Ligue_1 --max-requests 330 --md drafts.md --top 25 || echo "EXIT $?"
      - run: python -m football update $ARGS --leagues La_Liga,Bundesliga,Ligue_1 --max-requests 12
      - run: cat drafts.md
      - run: |
          python - <<'PY'
          import sqlite3
          con = sqlite3.connect("trial.db"); con.row_factory = sqlite3.Row
          for t, sql in (("checks", "select check_id, status, row_count, sample from core_quality_checks"),
                         ("own goals", "select match_id, player, team, goals, own_goals from core_player_matches where match_id in (5868051, 5881154, 5802965, 5868033) and (goals>0 or own_goals>0)"),
                         ("runs", "select run_at, requests, matches_new, matches_refreshed, matches_backfilled, seconds, errors from core_runs")):
              print("##", t)
              for r in con.execute(sql): print("  ", dict(r))
          PY
