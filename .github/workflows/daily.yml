name: Daily update

# Downloads what changed on FotMob, loads BigQuery, runs the data checks, drafts tweets.
# Needs one repository secret: GCP_SA_KEY (JSON key of a service account with the roles
# "BigQuery Data Editor" and "BigQuery Job User" on the project). See README, "Set up".

on:
  schedule:
    - cron: "23 4 * * *"          # every day 04:23 UTC (05:23 Paris in winter, 06:23 in summer)
  workflow_dispatch:
    inputs:
      max_requests:
        description: "Request cap for this run (what is left of the history continues next run)"
        default: "2000"
      top:
        description: "Number of tweet drafts"
        default: "25"
      rebuild:
        description: "First re-make every core table from the stored FotMob answers (no download; needed once after new columns)"
        type: boolean
        default: false

concurrency:
  group: daily-update              # never two runs at once: FotMob must not be hit in parallel
  cancel-in-progress: false

permissions:
  contents: read
  issues: write                    # the failure alert opens / closes an issue for the owner

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      BQ_PROJECT: ${{ vars.BQ_PROJECT || 'football-model-494509' }}
      PYTHONUNBUFFERED: "1"            # show the log line by line while the job runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Rebuild core tables from raw (no download)
        if: ${{ inputs.rebuild }}
        shell: bash                    # = bash -eo pipefail: a failure is not hidden by tee
        run: python -m football rebuild 2>&1 | tee -a run.log
      - name: Update, check, draft
        shell: bash                    # = bash -eo pipefail: a failure is not hidden by tee
        run: |
          python -m football daily --md drafts.md \
            --max-requests "${{ inputs.max_requests || '2000' }}" --top "${{ inputs.top || '25' }}" \
            2>&1 | tee -a run.log
      - name: What is loaded
        if: always()
        run: python -m football status
      - name: Drafts in the run summary
        if: always()
        run: test -f drafts.md && cat drafts.md >> "$GITHUB_STEP_SUMMARY" || echo "No drafts this run." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tweet-drafts
          path: drafts.md
          if-no-files-found: ignore

      # ---- alerts: an issue assigned to the owner (GitHub emails him), closed on recovery
      - name: Describe the failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m football.alert --log run.log --run-url "$RUN_URL" --out alert.md || true
      - name: Open or update the failure issue
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            let title = 'Daily update failed', body = `The run failed early. Full log: ${process.env.RUN_URL}`;
            if (fs.existsSync('alert.md')) {
              const lines = fs.readFileSync('alert.md', 'utf8').split('\n');
              title = lines[0]; body = lines.slice(1).join('\n');
            }
            const {owner, repo} = context.repo, label = 'daily-failure';
            try {
              await github.rest.issues.createLabel({owner, repo, name: label, color: 'd73a4a',
                description: 'Opened by the Daily update workflow when it fails'});
            } catch (e) { /* already exists */ }
            const open = await github.rest.issues.listForRepo({owner, repo, labels: label, state: 'open'});
            if (open.data.length) {
              await github.rest.issues.createComment({owner, repo, issue_number: open.data[0].number,
                body: `**Failed again:** ${title}\n\n${body}`});
            } else {
              await github.rest.issues.create({owner, repo, title, body, labels: [label], assignees: [owner]});
            }
      - name: Close the failure issue (recovered)
        if: success()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const open = await github.rest.issues.listForRepo({owner, repo, labels: 'daily-failure', state: 'open'});
            for (const issue of open.data) {
              await github.rest.issues.createComment({owner, repo, issue_number: issue.number,
                body: `Recovered: this run succeeded. ${process.env.RUN_URL}`});
              await github.rest.issues.update({owner, repo, issue_number: issue.number, state: 'closed'});
            }
