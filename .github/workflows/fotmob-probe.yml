name: FotMob probe

# Manual test: can GitHub's servers read FotMob, and is shot / player data in the answer?
# 2 to 35 requests depending on the option. Run it from the Actions tab (FotMob probe -> Run workflow).

on:
  push:                            # also runs when the probe itself changes on its branch
    branches: [fotmob-probe]
    paths: ["tools/**", ".github/workflows/fotmob-probe.yml"]
  workflow_dispatch:
    inputs:
      args:
        description: "Options: empty (basic test), --outline, --history, --match <id>, --league <id>"
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        env:
          ARGS: ${{ github.event_name == 'push' && '--history' || inputs.args }}
        run: |
          set -o pipefail
          python tools/dev_dump.py | tee probe.txt
      - name: Result in the run summary
        if: always()
        run: |
          { echo '```'; grep -v "^B64" probe.txt 2>/dev/null || echo "The probe did not start."; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fotmob-probe
          path: |
            probe.txt
            probe_out/
          if-no-files-found: ignore
