name: Probe old goals (temporary)
# TEMPORARY: remove before merge. READ ONLY: SELECT queries on BigQuery, no writes.
on:
  push:
    branches: [probe-old-goals]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: python -m scripts.probe_old_goals
