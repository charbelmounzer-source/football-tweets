name: Alert test (temporary)
# Same alert steps as daily.yml, behind a fake run. Fails while .alert-test-fail exists,
# succeeds once it is removed. No FotMob, no BigQuery. Removed before merge.
on:
  push:
    branches: [failure-alerts]
permissions:
  contents: read
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update, check, draft (fake)
        shell: bash
        run: |
          python -c "
          import os, sys
          print('1/3 update')
          if os.path.exists('.alert-test-fail'):
              print('  ERROR league Premier League 2026/27: leagues?id=47: HTTP 403')
              print('Finished with 1 download error(s) (see core.runs); data loaded so far is consistent and the next run retries.')
              sys.exit(1)
          print('  done: all fine')
          " 2>&1 | tee -a run.log
      # ---- alerts: an issue assigned to the owner (GitHub emails him), closed on recovery
      - name: Describe the failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m football.alert --log run.log --run-url "$RUN_URL" --out alert.md || true
          sed -i '1s/^/[TEST] /' alert.md
      - name: Open or update the failure issue
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            let title = 'Daily update failed', body = `The run failed early. Full log: ${process.env.RUN_URL}`;
            if (fs.existsSync('alert.md')) {
              const lines = fs.readFileSync('alert.md', 'utf8').split('\n');
              title = lines[0]; body = lines.slice(1).join('\n');
            }
            const {owner, repo} = context.repo, label = 'daily-failure';
            try {
              await github.rest.issues.createLabel({owner, repo, name: label, color: 'd73a4a',
                description: 'Opened by the Daily update workflow when it fails'});
            } catch (e) { /* already exists */ }
            const open = await github.rest.issues.listForRepo({owner, repo, labels: label, state: 'open'});
            if (open.data.length) {
              await github.rest.issues.createComment({owner, repo, issue_number: open.data[0].number,
                body: `**Failed again:** ${title}\n\n${body}`});
            } else {
              await github.rest.issues.create({owner, repo, title, body, labels: [label], assignees: [owner]});
            }
      - name: Close the failure issue (recovered)
        if: success()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const open = await github.rest.issues.listForRepo({owner, repo, labels: 'daily-failure', state: 'open'});
            for (const issue of open.data) {
              await github.rest.issues.createComment({owner, repo, issue_number: issue.number,
                body: `Recovered: this run succeeded. ${process.env.RUN_URL}`});
              await github.rest.issues.update({owner, repo, issue_number: issue.number, state: 'closed'});
            }
